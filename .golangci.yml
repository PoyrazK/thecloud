version: "2"

run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gocyclo
    - gosec
    - bodyclose
    - revive
    - errorlint
    - nilerr
    - gocritic
    - unparam
    - prealloc
    - nolintlint
    - misspell
    - unconvert
    - testifylint
    - thelper

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: true
  errcheck:
    exclude-functions:
      - fmt.Fprintln
      - fmt.Fprintf
      - fmt.Printf
      - fmt.Println
      - (*github.com/olekukonko/tablewriter.Table).Append
      - (*github.com/olekukonko/tablewriter.Table).Render
      - (*text/tabwriter.Writer).Flush
      - (net/http.ResponseWriter).Write
      - (*github.com/spf13/cobra.Command).MarkFlagRequired
  staticcheck:
    checks: ["all", "-QF1008"]
  gosec:
    settings:
      GOFLAGS: ""
    excludes:
      - G101
      - G106
      - G204
      - G304
      - G117
      - G301
      - G118
      - G115
      - G704
      - G115
      - G304
      - G301
      - G117
      - G204

issues:
  exclude-rules:
    - path: internal/handlers/ws
      linters:
        - errcheck
    - path: _test\.go
      linters:
        - gosec
    - path: internal/core/services/cluster_unit_test\.go
      linters:
        - unparam
      text: "MockInstanceService|MockRBACService"
    - path: internal/core/services/gateway\.go
      linters:
        - nolintlint
      text: "directive.*unused.*bodyclose"
    - linters:
        - gosec
      text: "G101|G106|G204|G304|G117|G301|G118|G115|G704"
    - path: _test\.go
      linters:
        - revive
      text: "unused-parameter"
    - path: _test\.go
      linters:
        - staticcheck
    - linters:
        - staticcheck
      text: "QF1012"
    - linters:
        - gosec
      text: "G304"
    - linters:
        - gosec
      text: "G301"
    - linters:
        - gosec
      text: "G117"
    - linters:
        - gosec
      text: "G115"
