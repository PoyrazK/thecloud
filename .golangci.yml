version: 2
run:
  timeout: 5m
  tests: false

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gocyclo
    - gosec
    - bodyclose
    - revive
    - errorlint
    - nilerr
    - gocritic
    - unparam
    - prealloc
    - nolintlint
    - misspell
    - unconvert
    - testifylint
    - thelper
  disable:
    - errcheck

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: true
  staticcheck:
    checks: ["all", "-QF1008"]

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - staticcheck
        - unused
        - gocritic
        - govet
        - ineffassign
        - bodyclose
        - errorlint
        - nilerr
        - unparam
        - prealloc
        - misspell
        - unconvert
        - testifylint
        - thelper
    - path: cmd/cloud/
      linters:
        - gosec
        - revive
    - path: internal/repositories/libvirt/
      linters:
        - gosec
    - path: internal/repositories/ovs/
      linters:
        - gosec
    - path: internal/repositories/k8s/
      linters:
        - gosec
    - path: internal/storage/
      linters:
        - gosec
    - path: pkg/testutil/constants\.go
      linters:
        - gosec
    - path: internal/core/services/cluster_unit_test\.go
      linters:
        - unparam
      text: "MockInstanceService|MockRBACService"
    - path: internal/core/services/gateway\.go
      linters:
        - nolintlint
      text: "directive.*unused.*bodyclose"
    - linters:
        - nolintlint
      text: "directive.*unused.*codeql"