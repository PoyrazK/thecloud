name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SECRETS_ENCRYPTION_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
  STORAGE_SECRET: ci-test-storage-secret-key
  POWERDNS_API_KEY: ci-test-powerdns-api-key

on:
  push:
    branches: [main, "feature/*"]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: true
      - name: Generate TLS test certs
        run: |
          mkdir -p cmd/storage-node/testdata/tls internal/api/setup/testdata/tls
          openssl req -x509 -newkey rsa:2048 -keyout cmd/storage-node/testdata/tls/test-key.pem -out cmd/storage-node/testdata/tls/test-cert.pem -days 365 -nodes -subj "/CN=test"
          openssl req -x509 -newkey rsa:2048 -keyout internal/api/setup/testdata/tls/ca-key.pem -out internal/api/setup/testdata/tls/ca-cert.pem -days 365 -nodes -subj "/CN=test-ca"
          openssl req -x509 -newkey rsa:2048 -keyout internal/api/setup/testdata/tls/test-key.pem -out internal/api/setup/testdata/tls/test-cert.pem -days 365 -nodes -subj "/CN=test"
      - name: Verify Swagger
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          make swagger
          if [ -n "$(git status --porcelain docs/swagger)" ]; then
            echo "Swagger docs are out of sync. Run 'swag init' and commit changes."
            git diff docs/swagger
            exit 1
          fi
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted. Run 'gofmt -w .' and commit:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check go mod tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "go.mod/go.sum are out of sync. Run 'go mod tidy' and commit."
            git diff go.mod go.sum
            exit 1
          fi
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          "$(go env GOPATH)/bin/golangci-lint" run ./...

  unit-tests:
    runs-on: ubuntu-latest
    services: &postgres-service
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cloud
          POSTGRES_PASSWORD: cloud
          POSTGRES_DB: cloud
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cloud"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: true
      - name: Install Dependencies
        run: go mod download
      - name: Generate TLS test certs
        run: |
          mkdir -p cmd/storage-node/testdata/tls internal/api/setup/testdata/tls
          openssl req -x509 -newkey rsa:2048 -keyout cmd/storage-node/testdata/tls/test-key.pem -out cmd/storage-node/testdata/tls/test-cert.pem -days 365 -nodes -subj "/CN=test"
          openssl req -x509 -newkey rsa:2048 -keyout internal/api/setup/testdata/tls/ca-key.pem -out internal/api/setup/testdata/tls/ca-cert.pem -days 365 -nodes -subj "/CN=test-ca"
          openssl req -x509 -newkey rsa:2048 -keyout internal/api/setup/testdata/tls/test-key.pem -out internal/api/setup/testdata/tls/test-cert.pem -days 365 -nodes -subj "/CN=test"
      - name: Wait for Database
        run: |
          timeout 60s bash -c 'until pg_isready -h 127.0.0.1 -p 5433 -U cloud; do
            echo "Waiting for postgres..."
            sleep 2
          done'
      - name: Run Unit Tests
        env:
          DATABASE_URL: postgres://cloud:cloud@127.0.0.1:5433/cloud?sslmode=disable
          TEST_DOCKER_NETWORK: cloud-network
        run: |
          docker network create ${TEST_DOCKER_NETWORK} || true
          go test -p 1 -v ./cmd/... ./internal/... ./pkg/...

  race-detection:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [
          "./internal/core/services/...",
          "./internal/repositories/...",
          "./cmd/... ./pkg/..."
        ]
    services: *postgres-service
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: true
      - name: Install Dependencies
        run: go mod download
      - name: Generate TLS test certs
        run: |
          mkdir -p cmd/storage-node/testdata/tls internal/api/setup/testdata/tls
          openssl req -x509 -newkey rsa:2048 -keyout cmd/storage-node/testdata/tls/test-key.pem -out cmd/storage-node/testdata/tls/test-cert.pem -days 365 -nodes -subj "/CN=test"
          openssl req -x509 -newkey rsa:2048 -keyout internal/api/setup/testdata/tls/ca-key.pem -out internal/api/setup/testdata/tls/ca-cert.pem -days 365 -nodes -subj "/CN=test-ca"
          openssl req -x509 -newkey rsa:2048 -keyout internal/api/setup/testdata/tls/test-key.pem -out internal/api/setup/testdata/tls/test-cert.pem -days 365 -nodes -subj "/CN=test"
      - name: Wait for Database
        run: |
          timeout 60s bash -c 'until pg_isready -h 127.0.0.1 -p 5433 -U cloud; do
            echo "Waiting for postgres..."
            sleep 2
          done'
      - name: Run Race Detection (${{ matrix.package }})
        env:
          DATABASE_URL: postgres://cloud:cloud@127.0.0.1:5433/cloud?sslmode=disable
          TEST_DOCKER_NETWORK: cloud-network
        run: |
          set -o pipefail
          docker network create ${TEST_DOCKER_NETWORK} || true
          go test -race -p 1 -v ${{ matrix.package }}

  integration-tests:
    runs-on: ubuntu-latest
    services: *postgres-service
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: true
      - name: Install Dependencies
        run: go mod download
      - name: Generate TLS test certs
        run: |
          mkdir -p cmd/storage-node/testdata/tls internal/api/setup/testdata/tls
          openssl req -x509 -newkey rsa:2048 -keyout cmd/storage-node/testdata/tls/test-key.pem -out cmd/storage-node/testdata/tls/test-cert.pem -days 365 -nodes -subj "/CN=test"
          openssl req -x509 -newkey rsa:2048 -keyout internal/api/setup/testdata/tls/ca-key.pem -out internal/api/setup/testdata/tls/ca-cert.pem -days 365 -nodes -subj "/CN=test-ca"
          openssl req -x509 -newkey rsa:2048 -keyout internal/api/setup/testdata/tls/test-key.pem -out internal/api/setup/testdata/tls/test-cert.pem -days 365 -nodes -subj "/CN=test"
      - name: Wait for Database
        run: |
          timeout 60s bash -c 'until pg_isready -h 127.0.0.1 -p 5433 -U cloud; do
            echo "Waiting for postgres..."
            sleep 2
          done'
      - name: Run Database Migrations
        run: |
          # Use unique database per run to avoid cleanup race conditions
          # that cause "column already exists" errors from stale Postgres state.
          DATABASE_NAME="cloud_test_${GITHUB_RUN_ID}"
          PGPASSWORD=cloud psql -h 127.0.0.1 -p 5433 -U cloud -d postgres -c "CREATE DATABASE ${DATABASE_NAME};"
          DATABASE_URL="postgres://cloud:cloud@127.0.0.1:5433/${DATABASE_NAME}?sslmode=disable" go run ./cmd/api -migrate-only
      - name: Run Integration Tests
        env:
          DATABASE_URL: postgres://cloud:cloud@127.0.0.1:5433/cloud_test_${{ github.run_id }}?sslmode=disable
        run: go test -tags=integration -v ./internal/repositories/postgres/...

  test-libvirt:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cloud
          POSTGRES_PASSWORD: cloud
          POSTGRES_DB: cloud
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cloud"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: true

      - name: Install Libvirt Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-kvm \
            libvirt-daemon-system \
            libvirt-clients \
            genisoimage \
            qemu-utils
          
          # Start libvirtd
          sudo systemctl start libvirtd
          sudo systemctl status libvirtd
          
          # Add runner to libvirt group
          sudo usermod -aG libvirt $USER
          sudo chmod 666 /var/run/libvirt/libvirt-sock

      - name: Setup Libvirt Storage and Network
        run: |
          # Create storage directory first
          sudo mkdir -p /tmp/libvirt-images
          sudo chmod 777 /tmp/libvirt-images
          
          # Create default storage pool
          sudo virsh pool-define-as default dir --target /tmp/libvirt-images
          sudo virsh pool-start default
          sudo virsh pool-autostart default
          
          # Check if default network exists
          if sudo virsh net-info default &>/dev/null; then
            echo "Default network already exists, ensuring it's active..."
            sudo virsh net-start default 2>/dev/null || true
            sudo virsh net-autostart default
          else
            echo "Creating default network..."
            cat > /tmp/default-net.xml << 'EOF'
          <network>
            <name>default</name>
            <forward mode='nat'/>
            <bridge name='virbr0' stp='on' delay='0'/>
            <ip address='192.168.122.1' netmask='255.255.255.0'>
              <dhcp>
                <range start='192.168.122.2' end='192.168.122.254'/>
              </dhcp>
            </ip>
          </network>
          EOF
            sudo virsh net-define /tmp/default-net.xml
            sudo virsh net-start default
            sudo virsh net-autostart default
          fi
          
          # Verify setup
          sudo virsh pool-list
          sudo virsh net-list

      - name: Install Dependencies
        run: go mod download
      - name: Generate TLS test certs
        run: |
          mkdir -p cmd/storage-node/testdata/tls internal/api/setup/testdata/tls
          openssl req -x509 -newkey rsa:2048 -keyout cmd/storage-node/testdata/tls/test-key.pem -out cmd/storage-node/testdata/tls/test-cert.pem -days 365 -nodes -subj "/CN=test"
          openssl req -x509 -newkey rsa:2048 -keyout internal/api/setup/testdata/tls/ca-key.pem -out internal/api/setup/testdata/tls/ca-cert.pem -days 365 -nodes -subj "/CN=test-ca"
          openssl req -x509 -newkey rsa:2048 -keyout internal/api/setup/testdata/tls/test-key.pem -out internal/api/setup/testdata/tls/test-cert.pem -days 365 -nodes -subj "/CN=test"
      - name: Wait for Database
        run: |
          timeout 60s bash -c 'until pg_isready -h 127.0.0.1 -p 5433 -U cloud; do
            echo "Waiting for postgres..."
            sleep 2
          done'

      - name: Run Libvirt Unit Tests
        env:
          DATABASE_URL: postgres://cloud:cloud@127.0.0.1:5433/cloud?sslmode=disable
          TEST_DOCKER_NETWORK: cloud-network
        run: |
          docker network create ${TEST_DOCKER_NETWORK} || true
          go test -v ./internal/repositories/libvirt/...

      - name: Test Backend Switching
        env:
          DATABASE_URL: postgres://cloud:cloud@127.0.0.1:5433/cloud?sslmode=disable
          SECRETS_ENCRYPTION_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
          STORAGE_SECRET: ci-test-storage-secret-key
          POWERDNS_API_KEY: ci-test-powerdns-api-key
        run: |
          # Ensure clean DB for switching tests
          PGPASSWORD=cloud psql -h 127.0.0.1 -p 5433 -U cloud -d postgres -c "DROP DATABASE IF EXISTS cloud;"
          PGPASSWORD=cloud psql -h 127.0.0.1 -p 5433 -U cloud -d postgres -c "CREATE DATABASE cloud;"
          go run ./cmd/api -migrate-only

          # Test with Docker backend (default)
          export TEST_DOCKER_NETWORK=cloud-network
          docker network create ${TEST_DOCKER_NETWORK} || true
          export COMPUTE_BACKEND=docker
          go test -p 1 -v -run TestInstanceService ./internal/core/services/...

          # Test with Libvirt backend
          export COMPUTE_BACKEND=libvirt
          go test -p 1 -v -run TestInstanceService ./internal/core/services/...

  test-firecracker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cloud
          POSTGRES_PASSWORD: cloud
          POSTGRES_DB: cloud
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cloud"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: true
      - name: Install Firecracker
        run: |
          FC_VERSION=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/firecracker-microvm/firecracker/releases/latest | jq -r '.tag_name')
          if [ -z "$FC_VERSION" ] || [ "$FC_VERSION" == "null" ]; then
            echo "Failed to fetch latest version, using fallback v1.14.1"
            FC_VERSION="v1.14.1"
          fi
          echo "Installing Firecracker $FC_VERSION"
          curl -L -o firecracker.tgz "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VERSION}/firecracker-${FC_VERSION}-$(uname -m).tgz"
          tar -xzf firecracker.tgz
          sudo mv release-${FC_VERSION}-$(uname -m)/firecracker-${FC_VERSION}-$(uname -m) /usr/local/bin/firecracker
          sudo chmod +x /usr/local/bin/firecracker
          firecracker --version
      - name: Install Dependencies
        run: go mod download
      - name: Generate TLS test certs
        run: |
          mkdir -p cmd/storage-node/testdata/tls internal/api/setup/testdata/tls
          openssl req -x509 -newkey rsa:2048 -keyout cmd/storage-node/testdata/tls/test-key.pem -out cmd/storage-node/testdata/tls/test-cert.pem -days 365 -nodes -subj "/CN=test"
          openssl req -x509 -newkey rsa:2048 -keyout internal/api/setup/testdata/tls/ca-key.pem -out internal/api/setup/testdata/tls/ca-cert.pem -days 365 -nodes -subj "/CN=test-ca"
          openssl req -x509 -newkey rsa:2048 -keyout internal/api/setup/testdata/tls/test-key.pem -out internal/api/setup/testdata/tls/test-cert.pem -days 365 -nodes -subj "/CN=test"
      - name: Wait for Redis
        run: |
          timeout 30s bash -c 'until redis-cli -h 127.0.0.1 -p 6379 ping 2>/dev/null | grep -q PONG; do sleep 1; done'
      - name: Run Firecracker Unit Tests
        run: go test -v ./internal/repositories/firecracker/...
      - name: Run Firecracker E2E Test
        env:
          FIRECRACKER_MOCK_MODE: "true"
        run: go test -v -run TestFirecrackerBackend_E2E ./tests/...
      - name: Run Firecracker API Integration
        env:
          DATABASE_URL: postgres://cloud:cloud@127.0.0.1:5433/cloud?sslmode=disable
          COMPUTE_BACKEND: firecracker
          FIRECRACKER_BINARY: /usr/local/bin/firecracker
          FIRECRACKER_KERNEL: /tmp/vmlinux
          FIRECRACKER_ROOTFS: /tmp/rootfs.ext4
          FIRECRACKER_MOCK_MODE: "true"
        run: |
          # Create dummy artifacts for Go logic path testing
          touch /tmp/vmlinux /tmp/rootfs.ext4
          
          # Ensure clean DB
          PGPASSWORD=cloud psql -h 127.0.0.1 -p 5433 -U cloud -d postgres -c "DROP DATABASE IF EXISTS cloud;"
          PGPASSWORD=cloud psql -h 127.0.0.1 -p 5433 -U cloud -d postgres -c "CREATE DATABASE cloud;"
          go run ./cmd/api -migrate-only
          
          # Start API in background with mock mode
          FIRECRACKER_MOCK_MODE=true COMPUTE_BACKEND=firecracker go run ./cmd/api &
          
          # Run API E2E tests for firecracker
          go test -v -run TestFirecrackerAPI_E2E ./tests/...

  build:
    needs: [lint, unit-tests, race-detection, integration-tests, test-libvirt, test-firecracker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: thecloud-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        
      - name: Scan Image Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'thecloud-api:latest'
          format: 'table'
          exit-code: '0' # Don't fail build yet, just report
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/')
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Lowercase Repo Name
        id: repo_name
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
          echo "REF_NAME=${GITHUB_REF_NAME//\//-}" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Staging Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.REPO_LC }}:staging
            ghcr.io/${{ steps.repo_name.outputs.REPO_LC }}:${{ steps.repo_name.outputs.REF_NAME }}
            ghcr.io/${{ steps.repo_name.outputs.REPO_LC }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Lowercase Repo Name
        id: repo_name
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and Push Production Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.REPO_LC }}:latest
            ghcr.io/${{ steps.repo_name.outputs.REPO_LC }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
