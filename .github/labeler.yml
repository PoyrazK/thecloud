          - 'cmd/api/**'
          - 'internal/api/**'

area/cli:
  - changed-files:
      - any-glob-to-any-file:
          - 'cmd/cloud/**'
          - 'cmd/autoscaler-server/**'

area/handlers:
  - changed-files:
      - any-glob-to-any-file:
          - 'internal/handlers/**'

area/services:
  - changed-files:
